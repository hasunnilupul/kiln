name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln_pos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URI: postgres://kiln:kiln@localhost:5432/kiln_pos
      # The builder's tests get their own database (see apps/builder/vitest.setup.ts).
      BUILDER_TEST_DATABASE_URI: postgres://kiln:kiln@localhost:5432/kiln_builder
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - name: Create the builder's database
        run: PGPASSWORD=kiln psql -h localhost -U kiln -d kiln_pos -c 'create database kiln_builder'
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Every schema change ships with its migration: generating one now must produce nothing.
      - name: Check migrations match the Payload config
        run: |
          pnpm --filter pos payload migrate:create schema-drift --skip-empty
          if [ -n "$(git status --porcelain -- apps/pos/src/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run: pnpm --filter pos payload migrate:create <name>"
            git status --porcelain -- apps/pos/src/migrations
            exit 1
          fi
      - name: Check builder migrations match the Payload config
        env:
          DATABASE_URI: ${{ env.BUILDER_TEST_DATABASE_URI }}
        run: |
          pnpm --filter builder payload migrate:create schema-drift --skip-empty
          if [ -n "$(git status --porcelain -- apps/builder/src/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run: pnpm --filter builder payload migrate:create <name>"
            git status --porcelain -- apps/builder/src/migrations
            exit 1
          fi

  # A full trading day in a real browser against a freshly seeded POS (M3 exit criterion).
  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln_pos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URI: postgres://kiln:kiln@localhost:5432/kiln_pos
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pos exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/pos/playwright-report
            apps/pos/test-results
          retention-days: 7
