# Local development only. Client deliveries do not use Docker.
services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln
      POSTGRES_DB: kiln_pos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiln -d kiln_pos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
